version: 2

models:
  - name: dim_customers
    columns:
      - name: customer_id
        data_tests:
          - not_null
          - unique

  - name: dim_products
    columns:
      - name: product_id
        data_tests:
          - not_null
          - unique

  - name: dim_stores
    columns:
      - name: store_id
        data_tests:
          - not_null
          - unique

  - name: dim_promotions
    columns:
      - name: promotion_id
        data_tests:
          - not_null
          - unique

  - name: fct_orders
    columns:
      - name: order_id
        data_tests:
          - not_null
          - unique
      - name: customer_id
        data_tests:
          - not_null
      - name: store_id
        data_tests:
          - not_null

  - name: fct_sales
    columns:
      - name: order_item_id
        data_tests:
          - not_null
          - unique
      - name: order_id
        data_tests:
          - not_null
      - name: product_id
        data_tests:
          - not_null

  - name: fct_returns
    columns:
      - name: return_id
        data_tests:
          - not_null
          - unique
      - name: order_id
        data_tests:
          - not_null

  - name: fct_inventory
    columns:
      - name: snapshot_date
        data_tests:
          - not_null
      - name: product_id
        data_tests:
          - not_null
      - name: store_id
        data_tests:
          - not_null